# Minimal OpenCode global MCP projection example.
#
# This example manages exactly one type = "local" command/args/environment
# entry under /mcp/<name> in strict default-user
# ~/.config/opencode/opencode.json. Environment bindings remain symbolic
# {env:SOURCE_NAME} references; daem never writes resolved values. It does not
# mutate opencode.jsonc, custom config layers, remote MCP rows, cwd/enabled/
# timeout/tool-policy fields, package installation, runtime MCP health,
# auth/session state, or plugin-bundled MCP.

version = 1
targets = ["opencode"]

[[mcp_server]]
name = "context7"
targets = ["opencode"]
scope = "global"
transport = "stdio"
command = "npx"
args = ["-y", "@upstash/context7-mcp@1.2.3"]
env = { CONTEXT7_API_TOKEN = { from_env = "CONTEXT7_API_TOKEN" } }
