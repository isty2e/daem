# Native Pi global MCP, requiring stable Pi >=1.0.2,<2.0.0 during apply.
# Enabled servers connect at Pi startup. A trusted project's same-name entry
# can replace or partially override this global definition.
# Daem owns only this config contribution, not settings, trust or runtime state.

version = 1
targets = ["pi"]

[[mcp_server]]
name = "context7"
targets = ["pi"]
scope = "global"
backend = "native"
transport = "stdio"
command = "npx"
args = ["-y", "@upstash/context7-mcp@1.2.3"]
env = { CONTEXT7_API_TOKEN = { from_env = "CONTEXT7_API_TOKEN" } }
