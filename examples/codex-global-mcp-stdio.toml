# Minimal Codex global MCP projection example.
#
# This example manages one mcp_servers entry inside ~/.codex/config.toml.
# CODEX_TOKEN is checked for presence during apply and rendered by name only as
# env_vars = ["CODEX_TOKEN"]; its value is never written by daem. This example
# does not run codex mcp, install packages, probe MCP runtime readiness, manage
# auth/session state, support custom config roots, or cover plugin-provided MCP.

version = 1
targets = ["codex"]

[[mcp_server]]
name = "context7"
targets = ["codex"]
scope = "global"
transport = "stdio"
command = "npx"
args = ["-y", "@upstash/context7-mcp@1.2.3"]
env = { CODEX_TOKEN = { from_env = "CODEX_TOKEN" } }
