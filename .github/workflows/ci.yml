name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  integrity:
    name: Integrity (Go 1.26.6, Linux amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up default Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - name: Set up Python for pre-commit
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.6.0
      - name: Record environment
        run: |
          test "$(go env GOVERSION)" = "go1.26.6"
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "amd64"
          go version
          go env GOOS GOARCH GOTOOLCHAIN
          python --version
          pre-commit --version
          uname -a
      - name: Verify module graph
        run: go mod verify
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  compatibility:
    name: Minimum line (Go 1.25.12, Linux amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up minimum supported Go line
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25.12"
          cache-dependency-path: go.sum
      - name: Prove toolchain selection
        run: |
          test "$(go env GOVERSION)" = "go1.25.12"
          test "$(go list -m -f '{{.GoVersion}}')" = "1.25.0"
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "amd64"
          go version
          go env GOOS GOARCH GOTOOLCHAIN
      - name: Verify and test minimum line
        run: |
          go mod verify
          tools/test.sh full
          go build -mod=readonly -trimpath -o "${RUNNER_TEMP}/daem" ./cmd/daem

  native:
    name: Native (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - name: darwin-arm64
            os: macos-26
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up default Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - name: Record native environment
        run: |
          test "$(go env GOVERSION)" = "go1.26.6"
          test "$(go env GOOS)" = "${{ matrix.goos }}"
          test "$(go env GOARCH)" = "${{ matrix.goarch }}"
          go version
          go env GOOS GOARCH GOTOOLCHAIN
          uname -a
      - name: Run full native tests
        run: tools/test.sh full
      - name: Build and smoke-test CLI identity and help
        run: |
          go build -mod=readonly -trimpath -o "${RUNNER_TEMP}/daem" ./cmd/daem
          "${RUNNER_TEMP}/daem" --help
          "${RUNNER_TEMP}/daem" help doctor
          "${RUNNER_TEMP}/daem" version
          "${RUNNER_TEMP}/daem" --version
          "${RUNNER_TEMP}/daem" version --json

  race:
    name: Race (Go 1.26.6, Linux amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up default Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - name: Run full race suite
        run: |
          test "$(go env GOVERSION)" = "go1.26.6"
          test "$(go env GOOS)" = "linux"
          test "$(go env GOARCH)" = "amd64"
          tools/test.sh race

  vulnerability:
    name: Vulnerability (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            goos: linux
            goarch: amd64
          - name: darwin-arm64
            os: macos-26
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up default Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - name: Record scanner environment
        run: |
          test "$(go env GOVERSION)" = "go1.26.6"
          test "$(go env GOOS)" = "${{ matrix.goos }}"
          test "$(go env GOARCH)" = "${{ matrix.goarch }}"
          go version
          go env GOOS GOARCH GOTOOLCHAIN
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 -version
      - name: Scan module, package, and symbol precision
        run: |
          scan_status=0
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 \
            -C cmd/daem -scan=module -show verbose || scan_status=1
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 \
            -test -scan=package -show verbose ./... || scan_status=1
          go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 \
            -test -scan=symbol -show verbose ./... || scan_status=1
          exit "$scan_status"

  windows_filesystem_capabilities:
    name: Windows filesystem capabilities
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up default Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - name: Run retained-directory and rooted-authority tests natively
        shell: bash
        run: |
          test "$(go env GOVERSION)" = "go1.26.6"
          test "$(go env GOOS)" = "windows"
          test "$(go env GOARCH)" = "amd64"
          go mod verify
          go test -count=1 \
            -run '^(TestReadRegularFileAtCountedStaysOnWindowsDirectoryHandle|TestReadRegularFileAtCountedRejectsWindowsEntryReplacement|TestReadRegularFileAtCountedExcludesWindowsConcurrentSameSizeWriter|TestReadRegularFileAtCountedRejectsExistingWindowsWriter|TestReadRegularFileContextCountedRejectsExistingWindowsWriter|TestReadRegularFileAtCountedHonorsCancellationBeforeSuccessOnWindows|TestWindowsFileIdentityRejectsUnprovableValues|TestOpenEntryAtRejectsWindowsAlternateDataStreamSyntax)$' \
            ./internal/filesnapshot
          go test -count=1 \
            -run '^(TestWindowsPluginObservationStaysOnRetainedRootHandle|TestObserveConfiguredPluginContributionsOnWindows|TestClassifySnapshotErrorDistinguishesIdentityAndBudget|TestClassifyDirectoryErrorUnsupportedTreeIsUnavailableNotMissing)$' \
            ./internal/assurance/observe/codexplugin
          go test -count=1 -run '^TestWindows' \
            ./internal/effect/storage/commit \
            ./internal/effect/mutation/rootedpath \
            ./internal/workflow/probe

  bsd_observation_compile:
    name: BSD observation compile (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: freebsd
            goarch: amd64
          - goos: freebsd
            goarch: "386"
          - goos: freebsd
            goarch: arm
          - goos: netbsd
            goarch: amd64
          - goos: netbsd
            goarch: "386"
          - goos: netbsd
            goarch: arm
          - goos: openbsd
            goarch: amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up default Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - name: Compile retained-directory snapshot tests without runtime claims
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          test "$(go env GOVERSION)" = "go1.26.6"
          go test -c \
            -o "${RUNNER_TEMP}/filesnapshot-${GOOS}-${GOARCH}.test" \
            ./internal/filesnapshot
          go test -c \
            -o "${RUNNER_TEMP}/codexplugin-${GOOS}-${GOARCH}.test" \
            ./internal/assurance/observe/codexplugin

  compile_only:
    name: Compile only (${{ matrix.goos }}/${{ matrix.goarch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: arm64
            suffix: ""
          - goos: linux
            goarch: "386"
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: .exe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up default Go toolchain
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26.6"
          cache-dependency-path: go.sum
      - name: Cross-build without runtime claims
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          test "$(go env GOVERSION)" = "go1.26.6"
          go build -mod=readonly -trimpath \
            -o "${RUNNER_TEMP}/daem-${GOOS}-${GOARCH}${{ matrix.suffix }}" \
            ./cmd/daem
